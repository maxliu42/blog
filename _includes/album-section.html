{% assign alt_text = include.artist | append: " - " | append: include.title %}

<div class="album-header">
  <img
    class="album-cover"
    src="{{ '/assets/images/albums/' | append: include.image | relative_url }}"
    alt="{{ alt_text }}"
  />
  <h2>{{ include.artist }} – {{ include.title }} ({{ include.year }})</h2>
</div>
